<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found | Elevate Digital</title>

    <!-- CSS Files -->
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/not-found.css">
    <link rel="stylesheet" href="/assets/css/variable.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">

    <!-- Poppins Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- Slick Slider CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick-theme.min.css">

    <!-- font awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <!-- =========================================
         404 PAGE
    ========================================== -->
    <main class="error-page">

        <!-- Decorative background elements -->
        <div class="error-bg-shape error-bg-shape-one"></div>
        <div class="error-bg-shape error-bg-shape-two"></div>

        <div class="container">

            <div class="error-content">

                <!-- Small brand label -->
                <a href="index.html" class="error-brand">
                    <span class="error-brand-dot"></span>
                    Elevate Digital
                </a>

                <!-- Large 404 -->
                <div class="error-number" aria-hidden="true">
                    <span>4</span>
                    <span class="error-zero">0</span>
                    <span>4</span>
                </div>

                <!-- Message -->
                <div class="error-message">

                    <span class="error-eyebrow">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        Page Not Found
                    </span>

                    <h1>
                        Looks like this page
                        <span>took a wrong turn.</span>
                    </h1>

                    <p>
                        The page you're looking for doesn't exist, may have
                        moved, or the URL might have been typed incorrectly.
                    </p>

                </div>

                <!-- CTA Buttons -->
                <div class="error-actions">

                    <a href="index.html" class="btn btn-primary">
                        <i class="fa-solid fa-house"></i>
                        Back to Homepage
                    </a>

                    <a href="portfolio.html" class="btn btn-secondary">
                        View My Work
                        <i class="fa-solid fa-arrow-right"></i>
                    </a>

                </div>

                <!-- Quick Links -->
                <div class="error-navigation">

                    <span>Or explore</span>

                    <div class="error-links">

                        <a href="about.html">
                            About
                        </a>

                        <a href="services.html">
                            Services
                        </a>

                        <a href="case-studies.html">
                            Case Studies
                        </a>

                        <a href="contact.html">
                            Contact
                        </a>

                    </div>

                </div>


            </div>

        </div>

    </main>

</body>

</html>
